<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMI Download Manager (HDM) v1.0.0</title>
<style>
:root{--bg:#0c1116;--card:#151c24;--line:#243040;--txt:#e8eef6;--dim:#8aa0b8;--acc:#00A86B;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,"Vazirmatn",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{width:40px;height:40px;border-radius:10px}
h1{font-size:18px;font-weight:700}
h1 span{color:var(--acc)}
h1 em{font-size:11px;color:var(--dim);font-style:normal;margin-left:6px}
.sub{font-size:12px;color:var(--dim)}
.badge{margin-left:auto;font-size:12px;padding:6px 10px;border-radius:999px;background:#13261d;color:var(--acc);border:1px solid #1e4a36}
.badge.warn{background:#2a2108;color:var(--warn);border-color:#5a4a12}
.badge.bad{background:#2a1212;color:#fca5a5;border-color:#5a2020}
main{max-width:920px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:14px}
.bar button,.btn{background:var(--acc);color:#04140c;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.job .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-weight:650;font-size:14px;word-break:break-all}
.meta{font-size:12px;color:var(--dim);margin:6px 0}
.track{height:8px;background:#0b1220;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#00A86B,#34d399);width:0}
.acts{display:flex;gap:6px;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.panel h2{font-size:14px;margin-bottom:8px}
.panel input{width:100%;margin:6px 0;background:#0e1620;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font-family:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.plan{background:#0e1620;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.plan b{display:block;font-size:13px;margin-bottom:4px}
.plan span{color:var(--acc);font-weight:700;font-size:14px}
footer{text-align:center;color:var(--dim);font-size:11px;padding:24px}
[dir=rtl] .badge{margin-left:0;margin-right:auto}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <div>
    <h1>HAMI Download Manager <span>(HDM)</span><em id="ver">v1.0.0</em></h1>
    <div class="sub" id="sub">Download Manager · HAMI SMART SYSTEMS</div>
  </div>
  <div class="row" style="margin-left:auto">
    <button class="btn ghost sm" id="langBtn" onclick="toggleLang()">فارسی</button>
    <button class="btn ghost sm" id="quitBtn" onclick="quitApp()" title="Close HDM">✕ Quit</button>
    <div id="badge" class="badge">…</div>
  </div>
</header>
<main>
  <div class="bar">
    <input id="url" placeholder="Paste a download URL and press Enter">
    <button class="btn" id="addBtn" onclick="add()">Add</button>
  </div>
  <div id="jobs"></div>

  <div class="panel">
    <h2 id="licTitle">License</h2>
    <p class="meta" id="licNote"></p>
    <div class="row">
      <input id="lname" placeholder="Name on the license" style="flex:1">
      <input id="lkey" placeholder="HG-XXXX-XXXX-XXXX-XXXX-XXXX" style="flex:1">
      <button class="btn" id="actBtn" onclick="activate()">Activate</button>
    </div>
    <p class="meta" id="licMsg"></p>
    <label class="row" style="margin-top:8px;font-size:13px">
      <input type="checkbox" id="startup" onchange="setStartup(this.checked)" style="width:auto">
      <span id="startupLbl">Start HDM with Windows</span>
    </label>
    <p class="meta" id="startupMsg"></p>
    <div class="plans">
      <div class="plan"><b id="p1">6 Months</b><span>580,000 T</span></div>
      <div class="plan"><b id="p2">1 Year</b><span>1,100,000 T</span></div>
      <div class="plan"><b id="p3">Lifetime</b><span>5,000,000 T</span></div>
    </div>
    <p class="meta" id="buyNote"></p>
  </div>
</main>
<footer id="foot">HAMI Download Manager (HDM) v1.0.0 · local app on port 17321</footer>
<script>
const T={
 en:{dir:'ltr',lang:'فارسی',sub:'Download Manager · HAMI SMART SYSTEMS',
  add:'Add',url:'Paste a download URL and press Enter',
  licTitle:'License',licNote:'7-day full-speed trial, then speed is limited to 150 KB/s until you activate a license.',
  name:'Name on the license',act:'Activate',
  p1:'6 Months',p2:'1 Year',p3:'Lifetime',
  buy:'Buy on hamidesigns.shop, then enter the name and key you received.',
  foot:'HAMI Download Manager (HDM) v1.0.0 · local app on port 17321',
  licensed:'Licensed',trial:'Trial · %d day(s) left',limited:'Limited · 150 KB/s — activate license',
  day:'day(s)',no:'No downloads yet. Paste a URL or use the Chrome extension.',
  pause:'Pause',resume:'Resume',cancel:'Cancel',expires:'Expires in %d days',life:'Lifetime license',startup:'Start HDM with Windows',quit:'✕ Quit'},
 fa:{dir:'rtl',lang:'English',sub:'مدیریت دانلود · اچ‌ام‌آی اسمارت سیستمز',
  add:'افزودن',url:'لینک دانلود را بچسبانید و Enter بزنید',
  licTitle:'لایسنس',licNote:'۷ روز سرعت کامل، سپس سرعت به ۱۵۰ کیلوبایت بر ثانیه محدود می‌شود تا لایسنس فعال کنید.',
  name:'نام روی لایسنس',act:'فعال‌سازی',
  p1:'۶ ماهه',p2:'یک‌ساله',p3:'مادام‌العمر',
  buy:'خرید از hamidesigns.shop؛ سپس نام و کلید دریافتی را وارد کنید.',
  foot:'HAMI Download Manager (HDM) v1.0.0 · پورت ۱۷۳۲۱',
  licensed:'لایسنس فعال',trial:'دوره آزمایشی · %d روز باقی‌مانده',limited:'محدود · ۱۵۰ کیلوبایت/ثانیه — لایسنس را فعال کنید',
  day:'روز',no:'هنوز دانلودی نیست. یک لینک بچسبانید یا از افزونه کروم استفاده کنید.',
  pause:'توقف',resume:'ادامه',cancel:'لغو',expires:'%d روز تا پایان',life:'لایسنس مادام‌العمر',startup:'اجرا با بالا آمدن ویندوز',quit:'✕ بستن'}
};
let L=localStorage.getItem('hmd-lang')||'en';
function applyLang(){
  const t=T[L];
  document.documentElement.dir=t.dir;document.documentElement.lang=L;
  $('langBtn').textContent=t.lang;$('sub').textContent=t.sub;$('addBtn').textContent=t.add;
  $('url').placeholder=t.url;$('licTitle').textContent=t.licTitle;$('licNote').textContent=t.licNote;
  $('lname').placeholder=t.name;$('actBtn').textContent=t.act;
  $('p1').textContent=t.p1;$('p2').textContent=t.p2;$('p3').textContent=t.p3;
  $('buyNote').textContent=t.buy;$('foot').textContent=t.foot;
  $('startupLbl').textContent=t.startup;$('quitBtn').textContent=t.quit;
}
function toggleLang(){L=(L==='en')?'fa':'en';localStorage.setItem('hmd-lang',L);applyLang();refresh();}
const $=id=>document.getElementById(id);
function fmt(n){n=Number(n)||0;if(n>1073741824)return(n/1073741824).toFixed(2)+' GB';if(n>1048576)return(n/1048576).toFixed(1)+' MB';if(n>1024)return(n/1024).toFixed(0)+' KB';return n+' B';}
function pct(j){return j.size?Math.min(100,j.done/j.size*100):(j.status==='done'?100:0)}
async function refresh(){
  const t=T[L];
  let L2={};let ST={};
  try{const s=await(await fetch('/api/status')).json();L2=s.license||{};ST=s;}catch(e){}
  const cb=$('startup');if(ST.startup!==undefined)cb.checked=ST.startup;
  const b=$('badge');
  if(L2.licensed){b.className='badge';b.textContent=(t.licensed+(L2.name?' · '+L2.name:''))+(L2.lifetime?' · '+t.life:(L2.days_left?' · '+t.expires.replace('%d',L2.days_left):''));}
  else if(L2.trial_active){b.className='badge warn';b.textContent=t.trial.replace('%d',Math.ceil(L2.trial_left_sec/86400));}
  else{b.className='badge bad';b.textContent=t.limited;}
  let jobs=[];
  try{jobs=(await(await fetch('/api/jobs')).json()).jobs||[];}catch(e){}
  $('jobs').innerHTML=jobs.map(job=>`
    <div class="job">
      <div class="top"><div class="name">${esc(job.name)}</div><div class="meta">${esc(job.status)}</div></div>
      <div class="meta">${fmt(job.done)} / ${job.size?fmt(job.size):'…'} · ${fmt(job.speed)}/s${job.error?' · '+esc(job.error):''}</div>
      <div class="track"><div class="fill" style="width:${pct(job)}%"></div></div>
      <div class="acts">
        ${job.status==='running'?`<button class="btn ghost sm" onclick="act('pause','${job.id}')">${t.pause}</button>`:''}
        ${job.status==='paused'||job.status==='error'?`<button class="btn sm" onclick="act('resume','${job.id}')">${t.resume}</button>`:''}
        ${job.status!=='done'?`<button class="btn ghost sm" onclick="act('cancel','${job.id}')">${t.cancel}</button>`:''}
      </div>
    </div>`).join('')||`<p class="meta">${t.no}</p>`;
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function add(){
  const url=$('url').value.trim();if(!url)return;
  await fetch('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  $('url').value='';refresh();
}
async function act(op,id){await fetch('/api/'+op,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});refresh();}
async function activate(){
  const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('lname').value,key:$('lkey').value})});
  const d=await r.json();$('licMsg').textContent=d.message||'';refresh();
}
async function setStartup(v){
  try{const r=await fetch('/api/startup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:v})});
  const d=await r.json();$('startupMsg').textContent=d.message||'';}catch(e){}
}
async function quitApp(){
  const t=T[L];
  if(!confirm(L==='fa'?'برنامه بسته شود؟':'Quit HDM?'))return;
  try{await fetch('/api/quit',{method:'POST'});}catch(e){}
  window.close();
  setTimeout(()=>{document.body.innerHTML='<div style="padding:40px;text-align:center"><h2>HDM closed</h2><p style="color:#8aa0b8">You can close this tab.</p></div>';},300);
}
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
applyLang();refresh();setInterval(refresh,1000);
</script>
</body>
</html>
